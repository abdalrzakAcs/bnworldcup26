<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#070e23">
  <meta name="description" content="مونديال العيلة — توقّع نتائج كأس العالم 2026 ونافس العيلة على اللقب">
  <title>مونديال العيلة 26</title>

  <link rel="manifest" href="manifest.webmanifest">
  <link rel="icon" href="icon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cairo:wght@700;800;900&family=Tajawal:wght@400;500;700;800;900&display=swap" rel="stylesheet" crossorigin="anonymous">

  <link rel="stylesheet" href="css/style.css">

  <script defer src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2/dist/umd/supabase.min.js" crossorigin="anonymous"></script>
  <script defer src="js/config.js"></script>
  <script defer src="js/app.js"></script>
</head>
<body>
  <!-- أيقونات مرسومة -->
  <svg width="0" height="0" style="position:absolute" aria-hidden="true">
    <defs>
      <symbol id="i-home" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round">
        <path d="M3.5 11.2 12 4l8.5 7.2"/><path d="M5.8 9.8V20h12.4V9.8"/><path d="M10 20v-5.4h4V20"/>
      </symbol>
      <symbol id="i-ball" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="8.6"/><path d="M12 8.2 15.6 10.8 14.2 15H9.8L8.4 10.8z"/>
        <path d="M12 8.2V3.5M15.6 10.8l4.4-1.4M14.2 15l2.7 3.8M9.8 15l-2.7 3.8M8.4 10.8 4 9.4"/>
      </symbol>
      <symbol id="i-chart" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <path d="M4 20h16"/><path d="M7 20v-6.5"/><path d="M12 20V6.5"/><path d="M17 20v-9.5"/>
      </symbol>
      <symbol id="i-gear" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <circle cx="12" cy="12" r="3.2"/>
        <path d="M12 2.8v3M12 18.2v3M2.8 12h3M18.2 12h3M5.5 5.5l2.1 2.1M16.4 16.4l2.1 2.1M18.5 5.5l-2.1 2.1M7.6 16.4l-2.1 2.1"/>
      </symbol>
      <symbol id="i-user" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round">
        <circle cx="12" cy="8.2" r="3.6"/><path d="M4.8 20c1.6-4.2 12.8-4.2 14.4 0"/>
      </symbol>
      <symbol id="i-trophy" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round">
        <path d="M7.5 4h9v4.2a4.5 4.5 0 0 1-9 0z"/>
        <path d="M7.5 5.4H5.2a2.3 2.3 0 0 0 .9 4.4l1.6.3M16.5 5.4h2.3a2.3 2.3 0 0 1-.9 4.4l-1.6.3"/>
        <path d="M12 12.7v3M9 20h6M9.8 15.7h4.4l.8 4.3H9z"/>
      </symbol>
    </defs>
  </svg>

  <!-- خلفية متحركة -->
  <div id="bg" aria-hidden="true">
    <div class="orb orb1"></div>
    <div class="orb orb2"></div>
    <div class="orb orb3"></div>
    <div class="stars"></div>
    <div class="beam beam1"></div>
    <div class="beam beam2"></div>
    <div class="pitch"></div>
  </div>

  <!-- شاشة التحميل -->
  <div id="splash">
    <div class="splash-scene">
      <div class="rays"></div>
      <svg class="trophy-svg" viewBox="0 0 200 220" aria-hidden="true">
        <defs>
          <linearGradient id="tg" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#ffe9a8"/><stop offset=".45" stop-color="#fbbf24"/><stop offset="1" stop-color="#d97706"/>
          </linearGradient>
          <linearGradient id="tg2" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#fff7df"/><stop offset="1" stop-color="#f59e0b"/>
          </linearGradient>
        </defs>
        <g stroke="url(#tg)" stroke-width="10" fill="none" stroke-linecap="round">
          <path d="M55 48 C28 48 20 62 24 80 C28 100 48 112 66 108"/>
          <path d="M145 48 C172 48 180 62 176 80 C172 100 152 112 134 108"/>
        </g>
        <path fill="url(#tg)" d="M52 38h96v26c0 44-22 70-48 76-26-6-48-32-48-76z"/>
        <ellipse cx="100" cy="38" rx="48" ry="9" fill="url(#tg2)"/>
        <path class="t-shine" d="M66 54 C66 88 76 112 92 124" stroke="rgba(255,255,255,.9)" stroke-width="6" fill="none" stroke-linecap="round"/>
        <rect x="92" y="138" width="16" height="26" rx="4" fill="url(#tg)"/>
        <path d="M70 176q30-14 60 0l6 14H64z" fill="url(#tg)"/>
        <rect x="58" y="192" width="84" height="18" rx="6" fill="#0c1733" stroke="url(#tg)" stroke-width="3"/>
        <text x="100" y="206" text-anchor="middle" font-size="13" font-weight="900" font-family="Cairo,Arial"><tspan fill="#ef2b4e">2</tspan><tspan fill="#11c26d">6</tspan></text>
      </svg>
      <span class="spark s1"></span><span class="spark s2"></span><span class="spark s3"></span>
    </div>
    <div class="kinetic splash-title"><span>مونديال</span> <span>العيلة</span></div>
    <div class="year-roll"><span>2</span><span>0</span><span>2</span><span>6</span></div>
    <div class="splash-bar"><i></i></div>
  </div>

  <!-- رأس الصفحة -->
  <header id="topbar" class="hidden">
    <div class="topbar-inner">
      <div class="brand">
        <span class="wc-badge"><span class="n2">2</span><span class="n6">6</span></span>
        <span class="brand-text">
          <span class="brand-name">مونديال العيلة</span>
          <span class="brand-sub" id="brandSub">دوري التوقّعات</span>
        </span>
        <span class="brand-ball"><svg width="20" height="20" viewBox="0 0 24 24" aria-hidden="true"><use href="#i-ball"/></svg></span>
      </div>
      <button id="profileBtn" class="profile-chip" title="حسابي"></button>
    </div>
  </header>

  <!-- المحتوى -->
  <main id="root"></main>

  <!-- شريط التنقل السفلي -->
  <nav id="navbar" class="hidden" aria-label="التنقل"></nav>

  <!-- نوافذ منبثقة وإشعارات -->
  <div id="modal-host"></div>
  <div id="toasts" aria-live="polite"></div>
  <canvas id="confetti" aria-hidden="true"></canvas>
</body>
</html>
